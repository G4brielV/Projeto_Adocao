services:
  app:
    build: .
    container_name: spring-adocao
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/projeto_adocao
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=SenhaSQL
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    container_name: postgres-adocao
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SenhaSQL
      POSTGRES_DB: projeto_adocao
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-adocao
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80" # A interface web ficará disponível na porta 5050
    depends_on:
      - db

volumes:
  postgres_data: